name: Publish Release

on:
  release:
    types: [created, published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to attach assets to (e.g. v1.2.2)"
        required: false
        default: "v1.2.2"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Artifacts & Release on GitHub
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build pyinstaller wheel pefile rich capstone

      - name: Build Python packages (wheel and sdist)
        run: |
          python -m build --outdir dist/

      - name: Build Windows standalone executable
        run: |
          pyinstaller --onefile --distpath dist-bin/ --name entropystrip main.py --clean

      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: |
            dist-bin/entropystrip.exe
            dist/*.whl
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Stash Python packages for PyPI
        uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: dist/

  pypi-publish:
    name: Publish to PyPI
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download package distributions
        uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist/

      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
